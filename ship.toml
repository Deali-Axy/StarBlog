schema = 2

[project]
name = "starblog"
description = "StarBlog API, Next.js and administration release"

# Release the reviewed working tree, including deployment fixes, without moving Git tags.
[version]
source = "env"
override_env = "SHIP_VERSION"
fallback = "error"

[features]
publish = true
deploy = true
verify = true
rollback = false

[build]
driver = "command"

[build.command]
run = "python3 deploy/build-release.py {{ version }}"
cwd = "."
outputs = ["artifacts/starblog-{{ version }}.tar.gz"]

[publish]
driver = "scp"

[publish.scp]
local = "artifacts/starblog-{{ version }}.tar.gz"
host = "deali.cn"
remote = "/home/deali/projects/starblog-v2/incoming/starblog-{{ version }}.tar.gz"

[[steps.pre_publish]]
name = "prepare-release-directory"
run = "ssh deali.cn 'mkdir -p /home/deali/projects/starblog-v2/incoming && chmod 700 /home/deali/projects/starblog-v2 /home/deali/projects/starblog-v2/incoming'"

[[steps.pre_deploy]]
name = "snapshot-local-translations-and-admin"
run = "python3 deploy/prepare-migration.py {{ version }}"

[deploy]
driver = "ssh"

[deploy.ssh]
host = "deali.cn"
commands = ["python3 -c 'import tarfile; t=tarfile.open(\"/home/deali/projects/starblog-v2/incoming/starblog-{{ version }}.tar.gz\"); exec(compile(t.extractfile(\"deploy/install-release.py\").read(), \"install-release.py\", \"exec\"))' {{ version }}"]

[verify]
driver = "http"

[verify.http]
url = "https://blog.deali.cn/health/ready"
expected_status = 200
attempts = 20
interval_seconds = 3
timeout_seconds = 10
