schema = 2

[project]
name = "starblog"
description = "StarBlog API, Next.js and administration images"

[version]
source = "env"
override_env = "SHIP_VERSION"
fallback = "error"

[features]
publish = true
deploy = true
verify = true
rollback = false

[[matrix]]
name = "api"

[[matrix]]
name = "web"

[[matrix]]
name = "gateway"

[[steps.prepare]]
name = "build-runtime-contexts"
run = "python3 deploy/build-image-context.py {{ version }}"
profiles = ["api"]

[build]
driver = "docker"

[build.docker]
image = "starblog"
context = "artifacts/image-context"
dockerfile = "deploy/images/{{ profile.name }}.Dockerfile"
platforms = ["linux/amd64"]
env_file = "deploy/build.env"
load = true
pull = true
build_args_from_env = false
provenance = false
sbom = false

[publish]
driver = "registry"

[publish.registry]
tag_latest_on_default_profile = false

[[publish.registry.targets]]
type = "private"
url = "ccr.ccs.tencentyun.com"
namespace = "deali"
image = "starblog"

[[steps.pre_deploy]]
name = "prepare-digest-pinned-release"
run = "python3 deploy/publish-deployment.py {{ version }}"

[deploy]
driver = "ssh"

[deploy.ssh]
host = "deali.cn"
commands = ["python3 /home/deali/projects/starblog-v2/image-releases/{{ version }}/deploy-images.py {{ version }}"]

[verify]
driver = "http"

[verify.http]
url = "https://blog.deali.cn/health/ready"
expected_status = 200
attempts = 20
interval_seconds = 3
timeout_seconds = 10
