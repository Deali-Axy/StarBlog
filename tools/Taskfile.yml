# https://taskfile.dev
version: "3"

tasks:
  build:
    desc: Build maintained StarBlog command-line tools that no longer depend on deleted class libraries
    cmds:
      - task: build:image-optimizer
      - task: build:backup

  build:image-optimizer:
    internal: true
    cmds:
      - dotnet build BlogImageOptimizer/BlogImageOptimizer.csproj

  build:backup:
    internal: true
    cmds:
      - dotnet build StarBlogBackup/StarBlog.BackupTool.csproj

  clean:
    desc: Clean maintained StarBlog command-line tools
    cmds:
      - task: clean:image-optimizer
      - task: clean:backup

  clean:image-optimizer:
    internal: true
    cmds:
      - dotnet clean BlogImageOptimizer/BlogImageOptimizer.csproj

  clean:backup:
    internal: true
    cmds:
      - dotnet clean StarBlogBackup/StarBlog.BackupTool.csproj
