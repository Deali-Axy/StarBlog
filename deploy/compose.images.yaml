name: starblog-v2

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${API_IMAGE}
    container_name: starblog-api-v2
    restart: unless-stopped
    working_dir: /app
    user: "1654:1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: Data Source=/app/data/app.db
      Auth__Jwt__Key: ${JWT_KEY}
      ReverseProxy__KnownProxies__0: 172.30.84.2
      TZ: Asia/Hong_Kong
    volumes:
      - ./data:/app/data
      - ./media:/app/wwwroot/media
      - ./cache/images:/app/wwwroot/is-cache
      - ./config/appsettings-email.json:/app/appsettings-email.json:ro
      - ./config/words.json:/app/words.json:ro
    networks:
      backend:
        ipv4_address: 172.30.84.3
    logging: *logging

  web:
    image: ${WEB_IMAGE}
    container_name: starblog-web-v2
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    user: "1000:1000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      INTERNAL_API_BASE_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=384
      TZ: Asia/Hong_Kong
    networks:
      backend:
        ipv4_address: 172.30.84.4
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    logging: *logging

  gateway:
    image: ${GATEWAY_IMAGE}
    container_name: starblog-gateway-v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:15080:8080"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend:
        ipv4_address: 172.30.84.2
      swag: {}
    depends_on:
      - api
      - web
    logging: *logging

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.84.0/24
  swag:
    name: swag
    external: true
