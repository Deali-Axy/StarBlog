# https://taskfile.dev
version: "3"

# 各应用维护自己的任务和工作目录；根 Taskfile 只提供统一入口。
includes:
  api:
    taskfile: apps/api/Taskfile.yml
    dir: apps/api
  admin:
    taskfile: apps/admin/Taskfile.yml
    dir: apps/admin
  web:
    taskfile: apps/web/Taskfile.yml
    dir: apps/web
  tools:
    taskfile: tools/Taskfile.yml
    dir: tools

tasks:
  install:
    desc: Install or restore dependencies for all product applications
    deps:
      - api:restore
      - admin:install
      - web:install

  dev:
    desc: Start the API, Admin, and Web development servers with goreman
    interactive: true
    preconditions:
      - sh: command -v goreman
        msg: "goreman not found. Install with: go install github.com/mattn/goreman@latest"
    cmds:
      # -set-ports=false keeps API 5039, Admin 5173, and Web 3001.
      - goreman -set-ports=false start

  dev:status:
    desc: Show goreman process status (requires a running task dev)
    cmds:
      - goreman run status

  dev:restart:
    desc: "Restart a goreman process (usage: task dev:restart -- admin)"
    preconditions:
      - sh: test -n '{{.CLI_ARGS}}'
        msg: "Specify a process name: task dev:restart -- api|admin|web"
    cmds:
      - goreman run restart {{.CLI_ARGS}}

  dev:stop:
    desc: Stop all goreman processes started by task dev
    cmds:
      # goreman exits after stop-all, so the RPC client often sees EOF.
      - cmd: goreman run stop-all
        ignore_error: true

  test:
    desc: Run API tests
    cmds:
      - task: api:test

  build:
    desc: Build product applications and maintained tools
    # Admin 与 .NET 可以并行；.NET 必须走同一个解决方案图，避免多个 dotnet build 同时写共享 obj。
    deps:
      - admin:build
      - web:build
      - build:dotnet

  build:dotnet:
    internal: true
    cmds:
      - dotnet build StarBlog.slnx

  format:
    desc: Format maintained .NET source code
    cmds:
      - task: api:format

  clean:
    desc: Clean build artifacts without deleting dependencies or runtime data
    deps:
      - admin:clean
      - web:clean
      - clean:dotnet

  clean:dotnet:
    internal: true
    cmds:
      - dotnet clean StarBlog.slnx
