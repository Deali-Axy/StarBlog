# https://taskfile.dev
version: "3"

vars:
  API_PROJECT: src/StarBlog.Api/StarBlog.Api.csproj
  TEST_PROJECT: tests/StarBlog.Api.Tests/StarBlog.Api.Tests.csproj
  ROOT_SOLUTION: ../../StarBlog.slnx

tasks:
  restore:
    desc: Restore API dependencies
    cmds:
      - dotnet restore {{.API_PROJECT}}

  dev:
    desc: Run the ASP.NET Core API with file watching
    dir: src/StarBlog.Api
    cmds:
      - dotnet watch run

  build:
    desc: Build the ASP.NET Core API
    cmds:
      - dotnet build {{.API_PROJECT}}

  test:
    desc: Run API unit and integration tests
    cmds:
      - dotnet test {{.TEST_PROJECT}} --nologo

  format:
    desc: Format all maintained .NET projects in the root solution
    cmds:
      - dotnet format {{.ROOT_SOLUTION}}

  clean:
    desc: Clean API build artifacts
    cmds:
      - dotnet clean {{.API_PROJECT}}

  db:add:
    desc: "Add an EF Core migration (usage: task api:db:add -- MigrationName)"
    cmds:
      - dotnet ef migrations add {{.CLI_ARGS}} --project {{.API_PROJECT}} --startup-project {{.API_PROJECT}} --output-dir Infrastructure/Persistence/Migrations

  db:update:
    desc: Apply EF Core migrations to the configured database
    cmds:
      - dotnet ef database update --project {{.API_PROJECT}} --startup-project {{.API_PROJECT}}

  db:reset:
    desc: Drop the local SQLite database and apply migrations from empty state
    cmds:
      - dotnet ef database drop --force --project {{.API_PROJECT}} --startup-project {{.API_PROJECT}}
      - dotnet ef database update --project {{.API_PROJECT}} --startup-project {{.API_PROJECT}}

  db:import-legacy:
    desc: "Import legacy blog content and media into the local EF Core database (requires Python 3)"
    cmds:
      - python3 ../../scripts/Import-LegacyBlog.py {{.CLI_ARGS}}
